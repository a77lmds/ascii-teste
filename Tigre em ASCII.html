<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#efe9dc;--fg:#2a2118;--muted:#6d5f4d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14110d;--fg:#eadfca;--muted:#9a8a72}}
:root[data-theme="dark"]{--bg:#cf811b;--fg:#eadfca;--muted:#9a8a72}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,serif;display:flex;flex-direction:column;align-items:center;padding:12px 8px}
h1{font-weight:400;font-size:1.4rem;margin:0 0 12px}
canvas{width:100%;max-width:1320px;height:auto;background:#050805;border-radius:6px}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;justify-content:center}
button{font:inherit;background:var(--fg);color:var(--bg);border:0;border-radius:4px;padding:8px 16px;cursor:pointer}
button:focus-visible{outline:3px solid #d9822b;outline-offset:2px}
</style></head><body>
<canvas id="c" role="img" aria-label="Tigre em ASCII colorido, animado a partir do GIF"></canvas>
<div class="row"><button id="p" type="button">Pausar</button><button id="m" type="button">Modo verde</button></div>
